# PodBox: builds the APK (podbox/build.sh zip) and publishes it as a GitHub release.
#   Tag push v*        -> build + release with podbox-<tag>.apk
#   Manual run         -> build only, APK as workflow artifact
# Secret PODBOX_KEYSTORE: base64 of ~/podbox/podbox.keystore (alias podbox, password android).
# Without the same key, the APK does not install over the existing app.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zip unzip pkg-config libfreetype-dev perl

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"

      - name: Restore keystore
        env:
          PODBOX_KEYSTORE_B64: ${{ secrets.PODBOX_KEYSTORE }}
        run: |
          if [ -z "$PODBOX_KEYSTORE_B64" ]; then
            echo "::error::Secret PODBOX_KEYSTORE missing (base64 of podbox.keystore)"
            exit 1
          fi
          echo "$PODBOX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/podbox.keystore"

      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('android/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build APK
        env:
          ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_PATH: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          PODBOX_BUILD: ${{ runner.temp }}/build-arm64
          PODBOX_KEYSTORE: ${{ runner.temp }}/podbox.keystore
          PODBOX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bash podbox/build.sh zip || { tail -50 "$PODBOX_BUILD"/*.log; exit 1; }
          NAME=podbox-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.apk
          mv podbox.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$APK" --title "PodBox ${{ github.ref_name }}" --generate-notes
