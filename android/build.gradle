// PodBox APK build (Android Gradle Plugin). Called by scripts/build.sh:
//   ./gradlew -Ppodbox.build=<rockbox build dir> assembleDebug
// Keeps the old Rockbox source layout (src/, res/, AndroidManifest.xml).
plugins {
    id 'com.android.application' version '8.7.3'
}

def rbBuild = file(findProperty('podbox.build') ?: "${System.getProperty('user.home')}/podbox/build-arm64")
// versionName from scripts/build.sh (tag or git describe), versionCode = x.y.z -> x*10000 + y*100 + z
def podboxVersion = findProperty('podbox.version') ?: '1.0'
def semver = podboxVersion =~ /^(\d+)\.(\d+)\.(\d+)/
def podboxVersionCode = semver.find() ?
        semver.group(1).toInteger() * 10000 + semver.group(2).toInteger() * 100 + semver.group(3).toInteger() : 1
def keystore = file(findProperty('podbox.keystore') ?: "${System.getProperty('user.home')}/podbox/podbox.keystore")

// Gradle output goes next to the native build, not into the source tree
layout.buildDirectory = new File(rbBuild, 'gradle')

android {
    namespace 'org.rockbox'
    compileSdk 34

    defaultConfig {
        // com.blueshark.player: the firmware only routes allow-listed packages
        // to the direct headphone output (no mixer/resampler), see STATUS.md
        applicationId(findProperty('podbox.appid') ?: 'com.blueshark.player')
        // API 21 is what the native part is built for (tools/configure)
        minSdk 21
        targetSdk 34
        versionCode podboxVersionCode
        versionName podboxVersion
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            jniLibs.srcDirs = [new File(rbBuild, 'libs')]
        }
    }

    signingConfigs {
        podbox {
            storeFile keystore
            storePassword 'android'
            keyAlias 'podbox'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.podbox
        }
        release {
            signingConfig signingConfigs.podbox
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // Rockbox loads codecs and libmisc.so (a zip) from nativeLibraryDir,
            // so the libs must be extracted on install.
            useLegacyPackaging true
            // already stripped by make; libmisc.so is not an ELF at all
            keepDebugSymbols += ['**/*.so']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
